<p><!DOCTYPE html> <html lang=&quot;en&quot;> <head>  <meta charset=&quot;UTF-8&quot;>  <meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;>  <title>Saying Hi</title>  <!-- Importing a clean modern font from Google Fonts -->  <link href=&quot;https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;>  <style>  /* Reset default styles */  * {  margin: 0;  padding: 0;  box-sizing: border-box;  }</p>

<p> /* Minimalist glassmorphism trigger button */  .menu-btn {  background: rgba(255, 255, 255, 0.15);  border: 1px solid rgba(255, 255, 255, 0.25);  color: #ffffff;  padding: 10px 18px;  border-radius: 30px;  cursor: pointer;  backdrop-filter: blur(10px);  -webkit-backdrop-filter: blur(10px);  font-weight: 700;  font-size: 0.9rem;  display: flex;  align-items: center;  gap: 8px;  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);  }</p>

<p> /* Embedded Slider layout elements */  .volume-section {  display: flex;  flex-direction: column;  gap: 6px;  }</p>

<p> /* --- COMMON INTERACTIVE MODAL STYLES --- */  .game-modal {  position: fixed;  top: 0;  left: 0;  width: 100%;  height: 100%;  background: rgba(0, 0, 0, 0.4);  backdrop-filter: blur(8px);  -webkit-backdrop-filter: blur(8px);  display: none;  justify-content: center;  align-items: center;  z-index: 30;  animation: modalFadeIn 0.25s ease-out;  }</p>

<p> <!-- Main Dynamic Layout Container -->  <div class=&quot;container&quot;>  <h1 id=&quot;greetingH1&quot;>Hi!</h1>  <p>Welcome to your minimalist website.</p>    <!-- Interactive dynamic links wrapper -->  <div class=&quot;links-container&quot;>  <a id=&quot;link1&quot; class=&quot;dynamic-link&quot; href=&quot;#&quot; target=&quot;_blank&quot;>Loading...</a>  <a id=&quot;link2&quot; class=&quot;dynamic-link&quot; href=&quot;#&quot; target=&quot;_blank&quot;>Loading...</a>  </div>  </div></p>

<p> <!-- Playable Digital Fidget Spinner Interactive Popover Container -->  <div class=&quot;game-modal&quot; id=&quot;spinnerModal&quot;>  <div class=&quot;game-card&quot; style=&quot;width: 320px;&quot;>  <div class=&quot;game-header&quot;>  <span>&#55356;&#57088; Fidget Spinner</span>  <button id=&quot;spCloseBtn&quot; class=&quot;game-control-btn&quot; style=&quot;background: rgba(244, 67, 54, 0.25); border-color: rgba(244, 67, 54, 0.4);&quot; aria-label=&quot;Close spinner&quot;>&#10005;</button>  </div>    <!-- Capture workspace container for rotation calculations -->  <div id=&quot;spinnerContainer&quot; style=&quot;position: relative; width: 220px; height: 220px; display: flex; justify-content: center; align-items: center; margin: 15px 0; user-select: none; touch-action: none;&quot;>  <!-- Full Vector CSS/SVG Component Layout -->  <svg id=&quot;fidgetSpinner&quot; viewBox=&quot;0 0 200 200&quot; style=&quot;width: 100%; height: 100%; cursor: grab; transform: rotate(0deg); filter: drop-shadow(0 10px 20px rgba(0,0,0,0.35)); transition: transform 0s;&quot;>  <!-- Outer Bearing Ring Connector Blades -->  <g transform=&quot;rotate(0, 100, 100)&quot;>  <line x1=&quot;100&quot; y1=&quot;100&quot; x2=&quot;100&quot; y2=&quot;45&quot; stroke=&quot;#ffffff&quot; stroke-width=&quot;24&quot; stroke-linecap=&quot;round&quot; />  <circle cx=&quot;100&quot; cy=&quot;45&quot; r=&quot;24&quot; fill=&quot;#ffffff&quot; />  <circle cx=&quot;100&quot; cy=&quot;45&quot; r=&quot;12&quot; fill=&quot;#111115&quot; />  </g>  <g transform=&quot;rotate(120, 100, 100)&quot;>  <line x1=&quot;100&quot; y1=&quot;100&quot; x2=&quot;100&quot; y2=&quot;45&quot; stroke=&quot;#ffffff&quot; stroke-width=&quot;24&quot; stroke-linecap=&quot;round&quot; />  <circle cx=&quot;100&quot; cy=&quot;45&quot; r=&quot;24&quot; fill=&quot;#ffffff&quot; />  <circle cx=&quot;100&quot; cy=&quot;45&quot; r=&quot;12&quot; fill=&quot;#111115&quot; />  </g>  <g transform=&quot;rotate(240, 100, 100)&quot;>  <line x <p> <script>  // Array of predefined pool links conforming to safety requirements  const words = [  &quot;quantum&quot;, &quot;nebula&quot;, &quot;ancient&quot;, &quot;cyber&quot;, &quot;forest&quot;, &quot;pixel&quot;, &quot;paradox&quot;,   &quot;geometry&quot;, &quot;safari&quot;, &quot;echo&quot;, &quot;harmony&quot;, &quot;gravity&quot;, &quot;stratosphere&quot;,   &quot;canvas&quot;, &quot;odyssey&quot;, &quot;vortex&quot;, &quot;alchemy&quot;, &quot;blueprint&quot;, &quot;horizon&quot;, &quot;mirage&quot;,  &quot;glitch&quot;, &quot;spectrum&quot;, &quot;chronicle&quot;, &quot;sonic&quot;, &quot;eclipse&quot;, &quot;infinity&quot;  ];</p>

<p> // --- CORE MINESWEEPER LOGIC ENGINE ---  let msRows = 9;  let msCols = 9;  let msMines = 10;  let msBoard = [];  let msFirstClick = true;  let msGameOver = false;  let msDigMode = true;</p>

<p> function initMinesweeper() {  msBoard = [];  msFirstClick = true;  msGameOver = false;  document.getElementById(&quot;msResetBtn&quot;).textContent = &quot;&#55357;&#56842;&quot;;  document.getElementById(&quot;minesweeperStatus&quot;).textContent = &quot;Click a cell to start!&quot;;  document.getElementById(&quot;msMinesCount&quot;).textContent = &#96;&#55357;&#56483; ${msMines}&#96;;    let cellSize = 34;  if (msCols === 12) cellSize = 28;  if (msCols === 15) cellSize = 23;</p>

<p> const gridEl = document.getElementById(&quot;minesweeperGrid&quot;);  gridEl.innerHTML = &quot;&quot;;  gridEl.style.gridTemplateColumns = &#96;repeat(${msCols}, ${cellSize}px)&#96;;  gridEl.style.gridTemplateRows = &#96;repeat(${msRows}, ${cellSize}px)&#96;;    for (let r = 0; r < msRows; r++) {  msBoard[r] = [];  for (let c = 0; c < msCols; c++) {  msBoard[r][c] = {  row: r, col: c, isMine: false, isRevealed: false, isFlagged: false, count: 0  };    const cellEl = document.createElement(&quot;div&quot;);  cellEl.classList.add(&quot;ms-cell&quot;);  cellEl.style.width = &#96;${cellSize}px&#96;;  cellEl.style.height = &#96;${cellSize}px&#96;;  cellEl.style.fontSize = &#96;${cellSize * 0.45}px&#96;;  cellEl.dataset.row = r;  cellEl.dataset.col = c;    cellEl.addEventListener(&quot;click&quot;, () => handleCellClick(r, c));  cellEl.addEventListener(&quot;contextmenu&quot;, (e) => {  e.preventDefault();  handleCellRightClick(r, c);  });    gridEl.appendChild(cellEl);  }  }  }</p>

<p> function placeMines(startRow, startCol) {  let minesPlaced = 0;  while (minesPlaced < msMines) {  let r = Math.floor(Math.random() * msRows);  let c = Math.floor(Math.random() * msCols);  if (r === startRow &amp;&amp; c === startCol) continue;  if (msBoard[r][c].isMine) continue;    msBoard[r][c].isMine = true;  minesPlaced++;  }    for (let r = 0; r < msRows; r++) {  for (let c = 0; c < msCols; c++) {  if (msBoard[r][c].isMine) continue;  let count = 0;  for (let dr = -1; dr <= 1; dr++) {  for (let dc = -1; dc <= 1; dc++) {  let nr = r + dr;  let nc = c + dc;  if (nr >= 0 &amp;&amp; nr < msRows &amp;&amp; nc >= 0 &amp;&amp; nc < msCols) {  if (msBoard[nr][nc].isMine) count++;  }  }  }  msBoard[r][c].count = count;  }  }  }</p>

<p> function handleCellClick(r, c) {  if (msGameOver) return;  if (!msDigMode) {  handleCellRightClick(r, c);  return;  }  let cell = msBoard[r][c];  if (cell.isRevealed || cell.isFlagged) return;  if (msFirstClick) {  msFirstClick = false;  placeMines(r, c);  }  revealCell(r, c);  checkGameStatus();  }</p>

<p> function handleCellRightClick(r, c) {  if (msGameOver) return;  let cell = msBoard[r][c];  if (cell.isRevealed) return;    cell.isFlagged = !cell.isFlagged;  const cellEl = document.querySelector(&#96;.ms-cell[data-row='${r}'][data-col='${c}']&#96;);    if (cell.isFlagged) {  cellEl.classList.add(&quot;flagged&quot;);  cellEl.textContent = &quot;&#55357;&#57001;&quot;;  } else {  cellEl.classList.remove(&quot;flagged&quot;);  cellEl.textContent = &quot;&quot;;  }    let countFlags = 0;  for (let i = 0; i < msRows; i++) {  for (let j = 0; j < msCols; j++) {  if (msBoard[i][j].isFlagged) countFlags++;  }  }  document.getElementById(&quot;msMinesCount&quot;).textContent = &#96;&#55357;&#56483; ${Math.max(0, msMines - countFlags)}&#96;;  }</p>

<p> function revealCell(r, c) {  let cell = msBoard[r][c];  if (cell.isRevealed || cell.isFlagged) return;    cell.isRevealed = true;  const cellEl = document.querySelector(&#96;.ms-cell[data-row='${r}'][data-col='${c}']&#96;);  cellEl.classList.add(&quot;revealed&quot;);    if (cell.isMine) {  cellEl.classList.add(&quot;mine&quot;);  cellEl.textContent = &quot;&#55357;&#56483;&quot;;  triggerGameOver(false);  return;  }    if (cell.count > 0) {  cellEl.textContent = cell.count;  cellEl.classList.add(&#96;ms-n${cell.count}&#96;);  } else {  cellEl.textContent = &quot;&quot;;  for (let dr = -1; dr <= 1; dr++) {  for (let dc = -1; dc <= 1; dc++) {  let nr = r + dr;  let nc = c + dc;  if (nr >= 0 &amp;&amp; nr < msRows &amp;&amp; nc >= 0 &amp;&amp; nc < msCols) {  revealCell(nr, nc);  }  }  }  }  }</p>

<p> function triggerGameOver(isWin) {  msGameOver = true;  if (isWin) {  document.getElementById(&quot;msResetBtn&quot;).textContent = &quot;&#55357;&#56846;&quot;;  document.getElementById(&quot;minesweeperStatus&quot;).textContent = &quot;&#55356;&#57225; You Win! Brilliant job!&quot;;  } else {  document.getElementById(&quot;msResetBtn&quot;).textContent = &quot;&#55357;&#56485;&quot;;  document.getElementById(&quot;minesweeperStatus&quot;).textContent = &quot;&#55357;&#56485; Game Over! Try again.&quot;;  for (let r = 0; r < msRows; r++) {  for (let c = 0; c < msCols; c++) {  let cell = msBoard[r][c];  if (cell.isMine) {  const cellEl = document.querySelector(&#96;.ms-cell[data-row='${r}'][data-col='${c}']&#96;);  if (cellEl) {  cellEl.classList.add(&quot;revealed&quot;, &quot;mine&quot;);  cellEl.textContent = &quot;&#55357;&#56483;&quot;;  }  }  }  }  }  }</p>

<p> function checkGameStatus() {  if (msGameOver) return;  let unrevealedSafeCells = 0;  for (let r = 0; r < msRows; r++) {  for (let c = 0; c < msCols; c++) {  if (!msBoard[r][c].isMine &amp;&amp; !msBoard[r][c].isRevealed) {  unrevealedSafeCells++;  }  }  }  if (unrevealedSafeCells === 0) {  triggerGameOver(true);  }  }</p>
